spring:
  config:
    import: >
      aws-secretsmanager:akive/dev/db,
      aws-secretsmanager:akive/dev/jwt,
      aws-secretsmanager:akive/openai

  datasource:
    url: jdbc:mysql://${host}:${port}/${dbname}?characterEncoding=UTF-8
    username: ${username}
    password: ${password}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: master.akive-redis-dev.3ay8cv.apn2.cache.amazonaws.com

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: development
  level:
    org.hibernate.SQL: debug
    org.springframework.jdbc.core.JdbcTemplate: debug

auth:
  jwt:
    access-token:
      secret: ${accessTokenSecret}
    refresh-token:
      secret: ${refreshTokenSecret}

cors:
  allowed-origins:
    - https://dev-www.akive.net

event:
  sqs:
    learner-insight-analysis:
      queue-name: akive-learner_insight_analysis_queue-dev.fifo
    learner-insight-embedding:
      queue-name: akive-learner_insight_embedding_queue-dev.fifo

vector:
  qdrant:
    host: dev-vector.akive.internal
