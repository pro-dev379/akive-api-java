spring:
  application:
    name: akive-api-java

  cloud:
    aws:
      region:
        static: ap-northeast-2

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

  data:
    redis:
      timeout: 3s
      connect-timeout: 3s
      repositories:
        enabled: false

jwt:
  issuer: akive
  access-token:
    expiration-minutes: 30
  refresh-token:
    expiration-days: 14

email:
  from:
    verification: no-reply@akive.net
    welcome: no-reply@akive.net
    support: support@akive.net

image:
  cdn:
    base-url: https://dev-cdn.akive.net
  storage:
    s3:
      bucket-name: akive-bucket-dev

openai:
  api-key: ${openAiApiKey}
  timeout: 30s
  streaming-timeout: 2m
  model:
    coaching: gpt-5.2
    conversation-title: gpt-4.1-nano
    learner-insight: gpt-5.4-mini
    embed: text-embedding-3-small
  embedding:
    dimensions: 1536

event:
  outbox:
    publish-delay: 1s

vector:
  qdrant:
    grpc-port: 6334
    tls-enabled: false
    timeout: 5s
    learner-insight-collection-name: learner_insight
