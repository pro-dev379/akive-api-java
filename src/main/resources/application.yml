spring:
  application:
    name: akive-api-java
  cloud:
    aws:
      secretsmanager:
        region: ap-northeast-2
      ses:
        region: ap-northeast-2
  config:
    import: >
      aws-secretsmanager:akive/dev/db,
      aws-secretsmanager:akive/dev/jwt
  datasource:
    url: jdbc:mysql://${host}:${port}/${dbname}?characterEncoding=UTF-8
    username: ${username}
    password: ${password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    show-sql: true
    hibernate:
      ddl-auto: update
  data:
    redis:
      timeout: 3s
      connect-timeout: 3s
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
jwt:
  access-token:
    secret: ${accessTokenSecret}
    expiration-minutes: 20_160 # 14 days
  refresh-token:
    secret: ${refreshTokenSecret}
    expiration-days: 30