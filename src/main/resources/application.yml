spring:
  application:
    name: akive-api-java

  cloud:
    aws:
      secretsmanager:
        region: ap-northeast-2
      ses:
        region: ap-northeast-2

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 100

  data:
    redis:
      timeout: 3s
      connect-timeout: 3s

jwt:
  issuer: akive
  access-token:
    expiration-minutes: 30
  refresh-token:
    expiration-days: 14

email:
  from:
    verification: akive@akive.net