spring:
  config:
    import: >
      aws-secretsmanager:akive/dev/db,
      aws-secretsmanager:akive/openai

  cloud:
    aws:
      sqs:
        enabled: false

  datasource:
    url: jdbc:mysql://localhost:3306/akive?characterEncoding=UTF-8
    username: ${username}
    password: ${password}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: localhost

jdbc:
  datasource-proxy:
    enabled: false

management:
  tracing:
    enabled: false

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.jdbc.core.JdbcTemplate: debug
    org.springframework.jdbc.core.StatementCreatorUtils: trace

auth:
  jwt:
    access-token:
      secret: local-access-secret-local-access-secret
      expiration-minutes: 525600 # 1 year
    refresh-token:
      secret: local-refresh-secret-local-refresh-secret
      expiration-days: 365

cors:
  allowed-origins:
    - http://localhost:3001

event:
  sqs:
    learner-insight-analysis:
      queue-name: akive-learner_insight_analysis_queue-dev.fifo
    learner-insight-embedding:
      queue-name: akive-learner_insight_embedding_queue-dev.fifo

vector:
  qdrant:
    host: localhost
