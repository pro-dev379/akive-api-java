spring:
  config:
    import: >
      aws-secretsmanager:akive/dev/db

  datasource:
    url: jdbc:mysql://localhost:3306/akive?characterEncoding=UTF-8
    username: ${username}
    password: ${password}

  data:
    redis:
      host: localhost

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.jdbc.core.JdbcTemplate: debug
    org.springframework.jdbc.core.StatementCreatorUtils: trace

jwt:
  access-token:
    secret: local-access-secret-local-access-secret
    expiration-minutes: 525600 # 1 year
  refresh-token:
    secret: local-refresh-secret-local-refresh-secret
    expiration-days: 365