spring:
  config:
    import: >
      aws-secretsmanager:akive/prod/db,
      aws-secretsmanager:akive/prod/jwt,
      aws-secretsmanager:akive/openai

  datasource:
    url: jdbc:mysql://${host}:${port}/${dbname}?characterEncoding=UTF-8
    username: ${username}
    password: ${password}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: master.akive-redis-prod.3ay8cv.apn2.cache.amazonaws.com

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: off

jwt:
  access-token:
    secret: ${accessTokenSecret}
  refresh-token:
    secret: ${refreshTokenSecret}

image:
  cdn:
    base-url: https://cdn.akive.net
  storage:
    s3:
      bucket-name: akive-bucket-prod

event:
  sqs:
    learner-insight-analysis:
      queue-name: akive-learner_insight_analysis_queue-prod.fifo
    learner-insight-embedding:
      queue-name: akive-learner_insight_embedding_queue-prod.fifo

vector:
  qdrant:
    host: vector.akive.internal
