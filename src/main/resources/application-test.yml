spring:
  cloud:
    aws:
      sqs:
        enabled: false

  datasource:
    url: jdbc:h2:mem:akive;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  data:
    redis:
      host: localhost

jdbc:
  datasource-proxy:
    enabled: false

management:
  tracing:
    enabled: false

auth:
  jwt:
    access-token:
      secret: test-access-secret-test-access-secret
    refresh-token:
      secret: test-refresh-secret-test-refresh-secret

cors:
  allowed-origins:
    - http://localhost:3001
    - https://dev-www.akive.net
    - https://www.akive.net

image:
  cleanup:
    cron: "-"

openai:
  api-key: test-api-key

event:
  sqs:
    learner-insight-analysis:
      queue-name: test-learner-insight-analysis.fifo
    learner-insight-embedding:
      queue-name: test-learner-insight-embedding.fifo

vector:
  qdrant:
    host: localhost
